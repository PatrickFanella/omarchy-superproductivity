name: PR CI

# Pull-request verification on GitHub-hosted runners. Main is verified and
# deployed by Gitea after the merge reaches it, so this runs only on pull
# requests and by hand.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: archlinux:base-20260823.0.578598
    steps:
      - name: Pin Arch Linux Archive
        run: printf 'Server = https://archive.archlinux.org/repos/2026/08/24/$repo/os/$arch\n' > /etc/pacman.d/mirrorlist
      - name: Install test tools
        run: pacman -Syu --noconfirm git imagemagick jq librsvg nodejs python quickshell qt5-declarative qt6-declarative ttf-jetbrains-mono
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify release files
        run: python3 scripts/verify_release_files.py
      - name: Test backend suites
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest tests/test_backend.py tests/test_phase1_backend.py tests/test_preview_assets.py
      - name: Test JavaScript
        run: node --test tests/*.test.js
      - name: Compile backend
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m py_compile backend/superproductivity.py
      - name: Validate plugin and lint QML against Omarchy
        run: |
          git init /tmp/omarchy
          git -C /tmp/omarchy remote add origin https://github.com/basecamp/omarchy.git
          git -C /tmp/omarchy fetch --depth 1 origin b86d4505c11b71f90b7bd14d6a80676863a70775
          git -C /tmp/omarchy checkout --detach FETCH_HEAD
          /tmp/omarchy/bin/omarchy-plugin-validate .
          qmllint -I /tmp/omarchy/shell BarWidget.qml Panel.qml Service.qml
      - name: Verify deterministic default sound
        run: |
          sha256sum assets/timer-complete.wav > /tmp/sound-before.sha256
          python3 scripts/generate_default_sound.py
          sha256sum --check /tmp/sound-before.sha256
      - name: Verify synthetic preview assets
        run: |
          sha256sum assets/preview-src/*.svg > /tmp/previews-before.sha256
          python3 scripts/generate_preview_assets.py
          sha256sum --check /tmp/previews-before.sha256
          python3 -m unittest tests/test_preview_assets.py

  ci-gate:
    name: CI gate
    if: always()
    needs: [test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every verification job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ["RESULTS"])
          expected = {'test'}
          assert set(results) == expected, results
          for name, result in results.items():
              assert result["result"] == "success", name + " did not pass"
          PY
